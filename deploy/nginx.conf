worker_processes auto;
events { worker_connections 1024; }

http {
    # Round-robin load balancing across the two gol-rs replicas.
    upstream gol_backends {
        server gol-a:8080;
        server gol-b:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://gol_backends;

            # WebSocket upgrade passthrough — required for /ws to work
            # through the load balancer.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;   # long-lived SSE / WebSocket streams
        }

        # Route health checks straight through so the LB can gate traffic.
        location = /healthz {
            proxy_pass http://gol_backends;
        }
    }
}
