# Kubernetes manifests for the gol-rs streaming server.
#
#   kubectl apply -f deploy/k8s/gol.yaml
#
# Demonstrates: containerised deployment, a load-balanced Service, liveness &
# readiness probes (availability), and a HorizontalPodAutoscaler that scales
# on CPU (throughput). Swap `image:` for your registry, e.g. after
# `docker build -t ghcr.io/sebby1770/gol-rs:0.2.0 .`
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gol
  labels: { app: gol }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gol }
  template:
    metadata:
      labels: { app: gol }
    spec:
      containers:
        - name: gol
          image: ghcr.io/sebby1770/gol-rs:0.2.0
          args: ["serve", "--addr", "0.0.0.0:8080", "--pattern", "gosper", "--width", "120", "--height", "60"]
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: "50m", memory: "16Mi" }
            limits:   { cpu: "250m", memory: "64Mi" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 1
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532          # distroless "nonroot" uid
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: gol
spec:
  type: LoadBalancer          # cloud LB in front of the pods
  selector: { app: gol }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gol
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gol
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Firewall / network policy: only allow ingress to the server port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gol-allow-http
spec:
  podSelector:
    matchLabels: { app: gol }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
