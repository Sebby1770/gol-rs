name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.85.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.85.0 clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +1.85.0 test --all-targets
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.85.0 doc --no-deps --all-features
      - name: Release build
        run: cargo +1.85.0 build --release
      - name: Smoke-test fresh-prefix installer
        env:
          PREFIX: ${{ runner.temp }}/gol-rs-install/fresh
        run: |
          ./install.sh
          "$PREFIX/bin/gol" --version
          ./install.sh --uninstall
      - name: Package
        run: cargo +1.85.0 package
