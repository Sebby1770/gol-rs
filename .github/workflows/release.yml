name: Release

# Cut a release by pushing a tag: `git tag v0.2.0 && git push --tags`.
# Builds a static-ish binary per platform and attaches them to the release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin=gol
          [ "${{ matrix.os }}" = "windows-latest" ] && bin=gol.exe
          mkdir dist
          cp "target/${{ matrix.target }}/release/$bin" dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          tar -czf "gol-${{ matrix.target }}.tar.gz" -C dist .
      - uses: softprops/action-gh-release@v2
        with:
          files: gol-*.tar.gz
