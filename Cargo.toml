[package]
name = "gol-rs"
version = "0.3.0"
edition = "2024"
description = "Conway's Game of Life in your terminal — and streamed live over a hand-rolled WebSocket server"
license = "MIT"
repository = "https://github.com/Sebby1770/gol-rs"
readme = "README.md"
keywords = ["cli", "game-of-life", "cellular-automata", "terminal", "websocket"]
categories = ["command-line-utilities", "simulation"]

[lib]
name = "gol_rs"
path = "src/lib.rs"

[[bin]]
name = "gol"
path = "src/main.rs"

# Deliberately zero dependencies: the HTTP + WebSocket server (SHA-1, base64,
# RFC 6455 framing) is all hand-rolled in src/wire.rs so the crate builds
# offline with nothing but the standard library.
[dependencies]

[profile.release]
lto = true
strip = true
codegen-units = 1
