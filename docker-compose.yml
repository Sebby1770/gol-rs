# Runs two gol-rs server replicas behind an nginx load balancer.
#
#   docker compose up --build
#   open http://localhost:8080
#
# nginx round-robins between the replicas, so each browser refresh may be
# served by a different backend — a hands-on demo of load balancing,
# horizontal scaling, and availability (kill one replica, the site stays up).
services:
  gol-a:
    build: .
    command: ["serve", "--addr", "0.0.0.0:8080", "--pattern", "gosper", "--width", "120", "--height", "60"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/gol", "bench", "--gens", "1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  gol-b:
    build: .
    command: ["serve", "--addr", "0.0.0.0:8080", "--pattern", "pulsar", "--width", "120", "--height", "60"]
    restart: unless-stopped

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gol-a
      - gol-b
    restart: unless-stopped
